<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIPPY, C.A. - Cotizador Oficial</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }
        h2 {
            color: #d4af37;
            text-align: center;
            font-size: 1.4em;
        }
        .info-box {
            background-color: #222;
            border-left: 4px solid #d4af37;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 0.85em;
            line-height: 1.4;
        }
        label {
            font-size: 0.9em;
            color: #d4af37;
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #d4af37;
            color: #121212;
            padding: 12px;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #c19b2e;
        }
        #resultado {
            margin-top: 20px;
            background: #222;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ZIPPY, C.A.</h2>
    <p style="text-align: center; font-size: 0.8em; color: #aaa;">Plataforma Multimodal • Calabozo</p>

    <div class="info-box">
        <strong>Pliego v2.0:</strong><br>
        • <strong>Turno Diurno (06:00 - 18:59):</strong> 0% recargo<br>
        • <strong>Turno Nocturno (19:00 - 22:59):</strong> +40% recargo<br>
        • <strong>Turno Trasnochado (23:00 - 05:59):</strong> +140% recargo
    </div>

    <label for="categoria">Categoría de Servicio:</label>
    <select id="categoria">
        <option value="moto">ZIPPY MOTO (Base: $3.00 | Km extra: $0.50)</option>
        <option value="auto">ZIPPY CAR (Base: $5.00 | Km extra: $0.80)</option>
    </select>

    <label for="distancia">Distancia estimada (Kilómetros):</label>
    <input type="number" id="distancia" placeholder="Ej. 4" step="0.1" min="1">

    <button onclick="calcularTarifa()">Calcular Cotización Pliego v2.0</button>

    <div id="resultado"></div>
</div>

<script>
function calcularTarifa() {
    let tipo = document.getElementById('categoria').value;
    let km = parseFloat(document.getElementById('distancia').value);
    
    if (isNaN(km) || km <= 0) {
        alert("Por favor, introduce una distancia válida en kilómetros.");
        return;
    }

    let base = tipo === 'moto' ? 3.00 : 5.00;
    let extraKm = tipo === 'moto' ? 0.50 : 0.80;
    let subtotal = base;

    if (km > 3) {
        subtotal += (km - 3) * extraKm;
    }

    // Hora actual del dispositivo para determinar el turno
    let hora = new Date().getHours();
    let recargo = 0;
    let turnoNombre = "Turno 1: Diurno (06:00 - 18:59)";

    if (hora >= 19 && hora < 23) {
        recargo = 0.40;
        turnoNombre = "Turno 2: Nocturno (+40%)";
    } else if (hora >= 23 || hora < 6) {
        recargo = 1.40;
        turnoNombre = "Turno 3: Trasnochado (+140%)";
    }

    let total = subtotal * (1 + recargo);

    let resDiv = document.getElementById('resultado');
    resDiv.style.display = 'block';
    resDiv.innerHTML = `
        <strong>📊 Desglose de Tarifa:</strong><br>
        • <strong>Distancia:</strong> ${km} km<br>
        • <strong>Franja:</strong> ${turnoNombre}<br>
        • <strong>Subtotal base/km:</strong> $${subtotal.toFixed(2)}<br>
        <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
        • <strong style="color: #d4af37; font-size: 1.1em;">Total a Cancelar: $${total.toFixed(2)} USD</strong>
    `;
}
</script>

</body>
</html>
